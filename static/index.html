<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GameForge</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%230F1830'/%3E%3Crect x='3' y='3' width='4' height='4' fill='%23FFC531'/%3E%3Crect x='9' y='3' width='4' height='4' fill='%232540F5'/%3E%3Crect x='3' y='9' width='4' height='4' fill='%232540F5'/%3E%3Crect x='9' y='9' width='4' height='4' fill='%23FFC531'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #EEF1F8;
  --panel: #F8F9FD;
  --ink: #0F1830;
  --ink-soft: #46506B;
  --mist: #D3D9EA;
  --cobalt: #2540F5;
  --cobalt-dark: #1B2FC0;
  --signal: #FFC531;
  --error: #FF8A94;
  --bezel: #0F1830;
  --font: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0B1122;
    --panel: #131B33;
    --ink: #EAEEFB;
    --ink-soft: #A3AECB;
    --mist: #263052;
    --bezel: #2A3560;
    --cobalt: #6F84FF;
    --cobalt-dark: #8A9BFF;
  }
}
* { box-sizing: border-box; }
html { color-scheme: light dark; }
body {
  margin: 0;
  font-family: var(--font);
  font-size: 1.0625rem;
  line-height: 1.5;
  color: var(--ink);
  background-color: var(--paper);
  background-image:
    linear-gradient(var(--mist) 1px, transparent 1px),
    linear-gradient(90deg, var(--mist) 1px, transparent 1px);
  background-size: 32px 32px;
  background-position: -1px -1px;
}
.shell { max-width: 1180px; margin: 0 auto; padding: 24px 16px 64px; }

/* ---- header ---- */
.brand { display: flex; align-items: center; gap: 12px; font-weight: 800; font-size: 1.25rem; letter-spacing: -0.01em; }
.mark { display: grid; grid-template-columns: repeat(2, 11px); gap: 3px; }
.mark i { width: 11px; height: 11px; background: var(--cobalt); }
.mark i:nth-child(1), .mark i:nth-child(4) { background: var(--signal); }

/* ---- layout ---- */
.stage { display: grid; gap: 32px; margin-top: 40px; align-items: start; }
@media (min-width: 940px) { .stage { grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: 56px; margin-top: 64px; } }

h1 {
  margin: 0 0 16px;
  font-size: clamp(2.3rem, 5.4vw, 3.7rem);
  line-height: 1.02;
  letter-spacing: -0.035em;
  font-weight: 800;
  font-variation-settings: "opsz" 96;
  max-width: 16ch;
}
.lede { margin: 0 0 28px; color: var(--ink-soft); max-width: 44ch; }

/* ---- form ---- */
label.field { display: block; font-weight: 700; margin-bottom: 8px; }
textarea {
  width: 100%; min-height: 128px; resize: vertical;
  font: inherit; color: var(--ink); background: var(--panel);
  border: 2px solid var(--ink); border-radius: 4px;
  padding: 14px 16px; line-height: 1.45;
}
textarea::placeholder { color: var(--ink-soft); opacity: .8; }
textarea:focus-visible, button:focus-visible, a:focus-visible, iframe:focus-visible {
  outline: 3px solid var(--cobalt); outline-offset: 2px;
}
.row { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-top: 8px; color: var(--ink-soft); font-size: .9rem; }
.row #count { white-space: nowrap; flex-shrink: 0; }
.examples { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0 24px; }
.chip {
  font: inherit; font-size: .92rem; color: var(--ink); cursor: pointer;
  background: transparent; border: 1.5px solid var(--ink-soft); border-radius: 999px; padding: 5px 14px;
}
.chip:hover { background: var(--panel); border-color: var(--ink); }
.go {
  font: inherit; font-weight: 800; font-size: 1.1rem; cursor: pointer;
  color: #fff; background: var(--cobalt); border: 2px solid var(--ink); border-radius: 4px;
  padding: 13px 26px; box-shadow: 4px 4px 0 var(--ink);
  transition: transform .08s, box-shadow .08s;
}
.go:hover:not(:disabled) { transform: translate(-1px, -1px); box-shadow: 5px 5px 0 var(--ink); }
.go:active:not(:disabled) { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--ink); }
.go:disabled { opacity: .55; cursor: not-allowed; box-shadow: 2px 2px 0 var(--ink); }
.form-error { color: #B4233A; font-weight: 500; min-height: 1.5em; margin: 12px 0 0; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .form-error { color: var(--error); }
  :root:not([data-theme="light"]) .go { color: #0B1122; }
}

/* ---- the screen ---- */
.bezel { background: var(--bezel); border-radius: 18px; padding: 12px; }
.screen {
  position: relative; aspect-ratio: 4 / 3; width: 100%;
  background-color: #0F1830;
  background-image:
    linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px);
  background-size: 20px 20px;
  border-radius: 6px; overflow: hidden; color: #EAEEFB;
  display: grid; place-items: center; text-align: center; padding: 20px;
}
.screen iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #000; }
.screen .idle { color: #A3AECB; max-width: 26ch; }
.screen .idle strong { display: block; color: #EAEEFB; font-size: 1.35rem; margin-bottom: 4px; }

.progress { width: 100%; max-width: 440px; }
.blocks { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
.blocks div { display: grid; gap: 8px; justify-items: center; font-size: .78rem; color: #8F9BBD; }
.blocks b { display: block; width: 100%; aspect-ratio: 1; background: rgba(255,255,255,.1); border-radius: 2px; }
.blocks .reached b { background: var(--signal); }
.blocks .reached { color: #EAEEFB; }
.blocks .now b { animation: blink 1s steps(2, jump-none) infinite; }
@keyframes blink { 50% { background: rgba(255,197,49,.35); } }
.status { margin: 26px 0 4px; font-size: 1.4rem; font-weight: 700; letter-spacing: -0.01em; }
.meta { color: #A3AECB; font-size: .95rem; margin: 0; }

.fail { max-width: 46ch; }
.fail strong { display: block; font-size: 1.3rem; margin-bottom: 8px; color: var(--error); }
.fail .small-btn { margin: 4px 4px 0; }
.fail pre { text-align: left; white-space: pre-wrap; word-break: break-word; font: .8rem/1.4 ui-monospace, Consolas, monospace; max-height: 11em; overflow: auto; background: rgba(0,0,0,.35); padding: 10px; border-radius: 4px; margin: 0 0 14px; }

.below { margin-top: 16px; display: grid; gap: 10px; }
.below p { margin: 0; }
.hint { color: var(--ink-soft); font-size: .95rem; }
.links { display: flex; gap: 20px; flex-wrap: wrap; }
.links a { color: var(--cobalt-dark); font-weight: 700; }
.howto { background: var(--panel); border-left: 4px solid var(--signal); padding: 12px 16px; white-space: pre-wrap; font-size: .95rem; max-width: 70ch; }
.small-btn {
  font: inherit; font-weight: 700; cursor: pointer; color: #0F1830; background: var(--signal);
  border: 2px solid #0F1830; border-radius: 4px; padding: 8px 16px;
}

/* ---- recent games ---- */
.recent { margin-top: 56px; }
.recent h2 { font-size: 1.35rem; letter-spacing: -0.01em; margin: 0 0 12px; }
.recent ul { list-style: none; margin: 0; padding: 0; background: var(--panel); border: 2px solid var(--ink); border-radius: 4px; }
.recent li { display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: center; padding: 12px 16px; }
.recent li:nth-child(even) { background: color-mix(in srgb, var(--mist) 45%, transparent); }
.recent .idea { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.recent .state { color: var(--ink-soft); font-size: .9rem; }
.recent button { font: inherit; font-weight: 700; cursor: pointer; color: var(--cobalt-dark); background: none; border: 0; padding: 4px 0; text-decoration: underline; text-underline-offset: 3px; }
.ver { margin: 32px 0 0; color: var(--ink-soft); font-size: .85rem; }
.empty { padding: 16px; color: var(--ink-soft); }

@media (prefers-reduced-motion: reduce) {
  .blocks .now b { animation: none; }
  .go { transition: none; }
}
</style>
</head>
<body>
<div class="shell">
  <header class="brand"><span class="mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span> GameForge</header>

  <main class="stage">
    <section aria-labelledby="title">
      <h1 id="title">Describe a 2D game. Play it in about five minutes.</h1>
      <p class="lede">Three AI agents design, write and review the game. Then a script play-tests it, and fixes it if it gets stuck, before you see it.</p>

      <form id="form" novalidate>
        <label class="field" for="idea">Your game idea</label>
        <textarea id="idea" maxlength="400" placeholder="Example: A two-player tank duel. Player 1 uses WASD and F, player 2 uses the arrow keys and Enter. Walls block bullets."></textarea>
        <div class="row"><span>Keyboard games only. Be specific about controls and how you win.</span><span id="count">0 / 400</span></div>
        <div class="examples" role="group" aria-label="Example ideas">
          <button type="button" class="chip" data-idea="Two-player tank duel on one screen. Player 1 uses WASD and F, player 2 uses the arrow keys and Enter. Each tank has 5 health. Best of 3 rounds.">Tank duel for two</button>
          <button type="button" class="chip" data-idea="Dodge falling rocks with a small ship moving left and right with the arrow keys. Rocks fall faster over time. Score is the seconds survived.">Dodge falling rocks</button>
          <button type="button" class="chip" data-idea="Snake game where eating apples makes the snake faster, and a bonus gold apple appears every 10 seconds for double points. Arrow keys to steer.">Snake with a bonus apple</button>
        </div>
        <button class="go" id="go" type="submit">Build game</button>
        <p class="form-error" id="formError" role="alert"></p>
      </form>
    </section>

    <section aria-label="Game screen">
      <div class="bezel"><div class="screen" id="screen"></div></div>
      <div class="below" id="below"></div>
    </section>
  </main>

  <section class="recent" aria-labelledby="recentTitle">
    <h2 id="recentTitle">Recent games</h2>
    <ul id="recent"></ul>
  </section>
  <p class="ver" id="ver"></p>
</div>

<script>
const STAGES = [["design","Design"],["code","Code"],["review","Review"],["test","Test"],["build","Build"],["done","Play"]];
const $ = (id) => document.getElementById(id);
const screen = $("screen"), below = $("below"), idea = $("idea"), go = $("go");
let timer = null, startedAt = 0, currentId = null;

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const mmss = (secs) => { secs = Math.max(0, Math.round(secs)); return Math.floor(secs/60) + ":" + String(secs % 60).padStart(2, "0"); };

function showIdle() {
  screen.innerHTML = '<div class="idle"><strong>Your game appears here</strong>Type an idea, then press Build game.</div>';
  below.innerHTML = "";
}

function showProgress(job) {
  const idx = job.stage === "queued" ? -1 : STAGES.findIndex(([k]) => k === job.stage);
  const blocks = STAGES.map(([k, label], i) =>
    `<div class="${i <= idx ? "reached" : ""} ${i === idx && job.status !== "done" ? "now" : ""}"><b></b>${label}</div>`).join("");
  const elapsed = (Date.now() / 1000) - job.created;
  const repairNote = job.repairs ? ` Fixed automatically ${job.repairs} time${job.repairs > 1 ? "s" : ""}.` : "";
  screen.innerHTML = `<div class="progress"><div class="blocks">${blocks}</div>
    <p class="status" aria-live="polite">${esc(job.message)}</p>
    <p class="meta">${mmss(elapsed)} elapsed.${repairNote} You can leave this tab open.</p></div>`;
  below.innerHTML = '<p class="hint">Most games take two to five minutes.</p>';
}

function showDone(job) {
  screen.innerHTML = `<iframe src="${esc(job.play_url)}" title="Your game" allow="autoplay; fullscreen"></iframe>`;
  const took = job.finished ? ` Built in ${mmss(job.finished - job.created)}${job.repairs ? `, fixed automatically ${job.repairs}x` : ""}${job.model ? `, model ${job.model}` : ""}.` : "";
  below.innerHTML = `
    <p class="hint">Click inside the game first (and once more if it says "Ready to start"), then use the keys.${esc(took)}</p>
    <p class="links"><a href="${esc(job.play_url)}" target="_blank" rel="noopener">Open full screen</a><a href="${esc(job.code_url)}" target="_blank" rel="noopener">View code</a></p>
    ${job.howto ? `<div class="howto"><strong>How to play</strong>\n${esc(job.howto)}</div>` : ""}`;
}

function showFailed(job) {
  screen.innerHTML = `<div class="fail"><strong>This game could not be built</strong><pre>${esc(job.error || "Unknown error")}</pre>${job.can_rebuild ? '<button class="small-btn" id="rebuild" type="button">Retry the build (keeps the same code)</button> ' : ""}<button class="small-btn" id="retry" type="button">Edit the idea and try again</button></div>`;
  below.innerHTML = '<p class="hint">Tip: shorter ideas with clear controls and one goal work best.</p>';
  $("retry").onclick = () => idea.focus();
  if (job.can_rebuild) $("rebuild").onclick = () => rebuildJob(job.id);
}

function render(job) {
  if (job.status === "done") showDone(job);
  else if (job.status === "failed") showFailed(job);
  else showProgress(job);
}

async function rebuildJob(id) {
  go.disabled = true;
  try {
    const r = await fetch("/api/jobs/" + id + "/rebuild", { method: "POST" });
    const data = await r.json();
    if (!r.ok) throw new Error(data.detail || "Could not retry the build.");
    poll(id); loadRecent();
  } catch (err) { $("formError").textContent = err.message; go.disabled = false; }
}

async function poll(id) {
  clearInterval(timer);
  currentId = id; history.replaceState(null, "", "#game=" + id);
  const tick = async () => {
    try {
      const r = await fetch("/api/jobs/" + id);
      if (!r.ok) throw new Error("Game not found");
      const job = await r.json();
      if (currentId !== id) return;
      render(job);
      if (job.status === "done" || job.status === "failed") {
        clearInterval(timer); go.disabled = false; loadRecent();
      }
    } catch (e) { clearInterval(timer); go.disabled = false; showIdle(); }
  };
  await tick();
  timer = setInterval(tick, 2000);
}

$("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  $("formError").textContent = "";
  const text = idea.value.trim();
  if (text.length < 8) { $("formError").textContent = "Describe the game in a few more words."; idea.focus(); return; }
  go.disabled = true;
  try {
    const r = await fetch("/api/jobs", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ idea: text }) });
    const data = await r.json();
    if (!r.ok) throw new Error(data.detail || "Something went wrong.");
    poll(data.id); loadRecent();
  } catch (err) { $("formError").textContent = err.message; go.disabled = false; }
});

idea.addEventListener("input", () => { $("count").textContent = idea.value.length + " / 400"; });
document.querySelectorAll(".chip").forEach((c) => c.addEventListener("click", () => {
  idea.value = c.dataset.idea; idea.dispatchEvent(new Event("input")); idea.focus();
}));

async function loadRecent() {
  const list = $("recent");
  try {
    const jobs = await (await fetch("/api/jobs")).json();
    if (!jobs.length) { list.innerHTML = '<li class="empty">No games yet. Your first one will show up here.</li>'; return; }
    const label = { done: "Ready", failed: "Failed", running: "Building", queued: "Queued" };
    list.innerHTML = jobs.map((j) => `<li><span class="idea" title="${esc(j.idea)}">${esc(j.idea)}</span>
      <span>${j.status === "done" ? `<button type="button" data-id="${j.id}">Play</button>` : `${j.can_rebuild ? `<button type="button" data-rebuild="${j.id}">Retry build</button>` : `<span class="state">${label[j.status] || j.status}</span>`}`}</span></li>`).join("");
    list.querySelectorAll("button[data-rebuild]").forEach((b) => b.addEventListener("click", () => rebuildJob(b.dataset.rebuild)));
    list.querySelectorAll("button[data-id]").forEach((b) => b.addEventListener("click", () => {
      go.disabled = false; poll(b.dataset.id); window.scrollTo({ top: 0, behavior: "smooth" });
    }));
  } catch (e) { list.innerHTML = '<li class="empty">Could not load recent games.</li>'; }
}

showIdle(); loadRecent();
fetch("/api/version").then((r) => r.json()).then((v) => { $("ver").textContent = "GameForge version " + v.version; }).catch(() => {});
const m = location.hash.match(/game=([a-f0-9]{8})/);
if (m) poll(m[1]);
</script>
</body>
</html>
